name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of burning minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Clean install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      # A contract that compiles but ships a surprise admin key is worse than one that fails to
      # build. This guards the "no privileged capability" claim in the README at CI level.
      - name: Assert no unexpected privileged entry points
        run: node scripts/checkPrivileged.cjs

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fail if a .env or key file was committed
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|\.keystore$'; then
            echo "::error::A secret-bearing file is tracked in git."
            exit 1
          fi
          echo "No tracked .env or key files."

      - name: Fail on a hardcoded private key
        run: |
          set -euo pipefail
          if git grep -nE 'DEPLOYER_PRIVATE_KEY *= *0x[a-fA-F0-9]{64}' -- . ':!*.example'; then
            echo "::error::A private key looks hardcoded."
            exit 1
          fi
          echo "No hardcoded private keys."

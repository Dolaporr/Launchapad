name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of burning minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Clean install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      # A contract that compiles but ships a surprise admin key is worse than one that fails to
      # build. This guards the "no privileged capability" claim in the README at CI level.
      - name: Assert no unexpected privileged entry points
        run: node scripts/checkPrivileged.cjs

  server:
    name: Server (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # node:sqlite's DatabaseSync landed in 22.5, and the server has no runtime
      # dependencies precisely so that it needs nothing but a modern Node.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The server has no dependencies of its own, but its chain tests stand up a
      # real EVM and check signature recovery against it, which needs hardhat and
      # ethers from contracts/. Without this they skip themselves — silently, and
      # exactly the tests that prove owner authentication works.
      - name: Install the test-only toolchain
        working-directory: contracts
        run: npm ci

      # pipefail matters: without it `tee` supplies the exit status and a failing
      # test suite would report green.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/server-test.log

      # `node --test` exits 0 when its glob matches nothing, and a test that skips
      # itself also exits 0. Neither is a pass, so the counts are checked rather
      # than the exit code.
      - name: Assert the tests actually ran
        run: |
          set -euo pipefail
          count() { sed -n "s/^[^0-9]*$1 \([0-9]\+\)$/\1/p" /tmp/server-test.log | tail -1; }
          pass="$(count pass)"; fail="$(count fail)"; skipped="$(count skipped)"
          echo "pass=$pass fail=$fail skipped=$skipped"
          if [[ -z "$pass" || "$pass" -lt 100 ]]; then
            echo "::error::Expected at least 100 passing server tests, got '${pass:-none}'."
            exit 1
          fi
          if [[ "$fail" != "0" || "$skipped" != "0" ]]; then
            echo "::error::Server tests must not fail or skip (fail=$fail skipped=$skipped)."
            exit 1
          fi

      # The server claims zero runtime dependencies. That claim is only worth
      # anything if something checks it.
      - name: Assert no runtime dependencies
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json');process.exit(Object.keys(p.dependencies||{}).length?1:0)"; then
            echo "No runtime dependencies."
          else
            echo "::error::The server picked up a runtime dependency."
            exit 1
          fi

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fail if a .env or key file was committed
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|\.keystore$'; then
            echo "::error::A secret-bearing file is tracked in git."
            exit 1
          fi
          echo "No tracked .env or key files."

      - name: Fail on a hardcoded private key
        run: |
          set -euo pipefail
          if git grep -nE 'DEPLOYER_PRIVATE_KEY *= *0x[a-fA-F0-9]{64}' -- . ':!*.example'; then
            echo "::error::A private key looks hardcoded."
            exit 1
          fi
          echo "No hardcoded private keys."
